<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Manak Mitra answers questions about Indian Standards and BIS services (ISI mark, CRS, hallmarking, lab testing) in English and Hindi, citing official BIS sources." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("manak-mitra-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark-theme");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Manak Mitra · BIS Standards Assistant | Bureau of Indian Standards</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
