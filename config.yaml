# BIS Assistant — single config source (env overrides: BIS_<SECTION>_<KEY>).
# Threshold changes require re-running the eval gate (plan §4, §8).
# Grounded/fusion floors moved here from hardcoded gates (issue #4 P0-2).
retrieval:
  direct_score: 15.0
  direct_margin: 5.0
  clarify_floor: 6.0
  weak_floor: 3.0
  max_rounds: 2
  max_questions_per_turn: 2
  grounded_score: 10.0       # curated "has a candidate" floor (BIS_RETRIEVAL_GROUNDED_SCORE)
  fusion_strong_score: 15.0  # metadata citations fused into corpus answers above this
  scorer: keyword        # keyword | bm25 (Phase 2)
  kb_backend: json       # json | sqlite (Phase 1)

privacy:
  thread_ttl_days: 7
  retention_days: 90
  consent_valid_days: 365
  erasure_sla_hours: 24

api:
  port: 8000
  cors_allow_origins: ["http://127.0.0.1:5173", "http://localhost:5173"]

ingest:
  crawl_delay_s: 2.0
  live_crawl_enabled: false   # fixtures only until Phase 1 review
  refresh_days: 7
  staleness_alert_days: 14

observability:
  trace_sample_rate: 0.05
  trace_retention_days: 14
  latency_p95_ms: 2000

rag:
  enabled: true         # retrieve lab evidence for every configured model answer
  db_path: kb/bis_rag.db  # BIS_RAG_DB_PATH
  top_k: 5              # BIS_RAG_TOP_K
  minimum_relevance: 0.25  # BIS_RAG_MINIMUM_RELEVANCE; normalized relevance floor [0,1]
  catalogue_top_k: 5       # BIS_RAG_CATALOGUE_TOP_K; maximum catalogue candidates [1,100]
  semantic: true        # BIS_RAG_SEMANTIC — use a built dense index when available
  embedding_model: BAAI/bge-small-en-v1.5  # English dense retrieval; install/index explicitly
  reranker_model: ""    # BIS_RAG_RERANKER_MODEL — optional CrossEncoder reranker
  weight_lexical: 1.0
  weight_semantic: 0.3
  exact_boost: 50.0     # exact IS-number/designation boost

llm:
  provider: openai-compatible  # BIS_LLM_PROVIDER — openai-compatible | gemini | ollama | anthropic
  model: ""             # BIS_LLM_MODEL; empty = model-unavailable response
  api_key: ""           # BIS_LLM_API_KEY; keep real keys in the ignored .env
  base_url: https://api.openai.com/v1  # local and provider-specific endpoints are supported
  temperature: 0.2
  max_tokens: 900         # Hindi (Devanagari) answers with citations are token-hungry
  timeout_s: 20.0           # interactive budget; answers with citations can take ~5-10s
  retries: 1              # BIS_LLM_RETRIES — one bounded retry for transient provider errors
  fallback_model: ""      # BIS_LLM_FALLBACK_MODEL — same-provider model used on rate limits/errors
  utility_model: ""       # BIS_LLM_UTILITY_MODEL — small model for query rewrites and titles
